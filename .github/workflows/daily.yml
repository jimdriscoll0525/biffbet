name: BiffBet daily pipeline

# Runs the engine on a schedule and publishes to Supabase (which the website
# reads). Supabase is the source of truth: each run PULLs prior state into a
# fresh SQLite, grades yesterday, builds today's slate, then SYNCs back.
on:
  # Scheduling is handled EXTERNALLY by cron-job.org, which POSTs to the
  # workflow_dispatch REST API on a reliable cadence (morning + every 30m
  # through the afternoon/closing window). GitHub's own `schedule:` cron was
  # too unreliable here (runs delayed up to ~3h, */30 ticks dropped), so it was
  # removed -- this workflow now runs ONLY on dispatch (cron-job.org + manual).
  # `scope` lets cron-job.org tick sports independently (football's weekly
  # cadence vs MLB's daily): POST {"ref":"main","inputs":{"scope":"football"}}
  # for football-only runs (Sat/Sun closing windows), "mlb" for MLB-only, and
  # the default "all" runs everything (the existing daily ticks stay valid).
  # "rsi" (2026-09-26) is the WEEKLY self-improvement review: a Monday
  # cron-job.org tick POSTs {"ref":"main","inputs":{"scope":"rsi"}}; it runs
  # only the RSI block below (pull history -> review -> proposals -> email),
  # never the pick pipelines.
  workflow_dispatch:
    inputs:
      scope:
        description: "Which pipelines to run"
        type: choice
        default: all
        options: [all, mlb, football, rsi]

# Never let two runs clobber each other (they share the Supabase tables).
concurrency:
  group: biffbet-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      # Check out into a subfolder so the package imports as `mlb_value_bot`
      # (i.e. `python -m mlb_value_bot ...` resolves from the workspace root).
      - name: Checkout engine into ./mlb_value_bot
        uses: actions/checkout@v4
        with:
          path: mlb_value_bot

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: mlb_value_bot/requirements.txt

      - name: Install dependencies
        run: pip install -r mlb_value_bot/requirements.txt

      # Persist the parquet TTL cache across runs (2026-08-30). The runner is
      # ephemeral, so every 3-hourly tick re-fetched the CFBD season pulls
      # (teams/stats/PPA/SP+/venues/games x 2 seasons) — ~8 calls x 8 runs/day
      # against a FREE tier of 1,000 calls/MONTH (313 left on Aug 30 after 10
      # in-season days). With the cache restored, the client's own TTLs apply
      # (season pulls weekly, games 3h). `key` is unique per run so the cache
      # is re-saved every time; `restore-keys` picks up the newest prior one.
      - name: Restore data cache (CFBD / nflverse parquet)
        uses: actions/cache@v4
        with:
          path: mlb_value_bot/storage/cache
          key: data-cache-${{ github.run_id }}
          restore-keys: |
            data-cache-

      - name: Run pipeline (pull -> grade -> slate -> sync)
        if: ${{ inputs.scope != 'football' && inputs.scope != 'rsi' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BANKROLL: ${{ secrets.BANKROLL }}   # optional; defaults to 1000 if unset
        run: |
          python -m mlb_value_bot pull
          python -m mlb_value_bot results || echo "results: nothing to settle"
          python -m mlb_value_bot today
          python -m mlb_value_bot sync
          # RSI: settle yesterday's shadow (challenger) picks. Tolerant: the
          # champion run above is already synced.
          python -m mlb_value_bot.rsi grade --engine mlb || echo "rsi grade mlb: skipped"

      # GriffBet (challenger) — ADDITIVE. Runs the same pull -> grade -> slate ->
      # sync flow on GriffBet's independent config + store + Supabase tables,
      # after BiffBet. The `sync` step also computes + pushes the referee
      # snapshot (cross-model report). BiffBet's steps above are unchanged; a
      # GriffBet failure must not mask BiffBet's run, so each step is tolerant.
      - name: Run GriffBet pipeline (pull -> grade -> slate -> sync)
        if: ${{ inputs.scope != 'football' && inputs.scope != 'rsi' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BANKROLL: ${{ secrets.BANKROLL }}
        run: |
          python -m mlb_value_bot.griffbet pull            || echo "griff pull: skipped"
          python -m mlb_value_bot.griffbet results         || echo "griff results: nothing to settle"
          python -m mlb_value_bot.griffbet train           || echo "griff train: skipped"
          python -m mlb_value_bot.griffbet today            || echo "griff today: skipped"
          python -m mlb_value_bot.griffbet sync             || echo "griff sync: skipped"

      # Football (NFL + college FBS, PAPER) — ADDITIVE, same tolerant contract
      # as GriffBet: a football failure must never mask the MLB run and vice
      # versa. In-season cron-job.org ticks fire scope=football on the weekly
      # line-capture cadence (Tue open, daily refresh, Thu/Sat/Sun/Mon closes).
      - name: Run Football pipeline (pull -> grade -> slate -> sync)
        if: ${{ inputs.scope != 'mlb' && inputs.scope != 'rsi' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -m mlb_value_bot.football pull            || echo "football pull: skipped"
          python -m mlb_value_bot.football results         || echo "football results: nothing to settle"
          python -m mlb_value_bot.football today            || echo "football today: skipped"
          python -m mlb_value_bot.football sync             || echo "football sync: skipped"
          python -m mlb_value_bot.rsi grade --engine football || echo "rsi grade football: skipped"

      # Live totals (live_total_v1) — ADDITIVE. Grades the site-written live
      # in-game over/under recommendations and refreshes the drive-stat priors
      # the live model reads. Both use only free feeds (nflverse), so they run
      # year-round and are NOT behind the season_window odds-credit gate.
      # (`sync` above already pushes drive stats; the explicit step keeps the
      # priors fresh even when the odds-driven sync short-circuits off-season.)
      - name: Grade live totals + refresh drive priors
        if: ${{ inputs.scope != 'mlb' && inputs.scope != 'rsi' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -m mlb_value_bot.football grade-live      || echo "grade-live: skipped"
          python -m mlb_value_bot.football drive-stats --sync || echo "drive-stats: skipped"

      # RSI weekly review (2026-09-26) — ONLY on scope=rsi (Monday tick). Pulls
      # every engine's history into fresh SQLite (the review itself reads the
      # rsi_scored_games view in Supabase, but the pulls keep the runner's
      # local stores consistent for any helper that opens them), then mines
      # segments, reconciles proposals, refreshes champion-vs-challenger stats
      # and rolling-window rollback flags, and emails the summary via Resend.
      # Nothing here changes the live model: it writes rsi_* tables only.
      - name: RSI weekly review (segments -> proposals -> email)
        if: ${{ inputs.scope == 'rsi' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python -m mlb_value_bot pull                     || echo "rsi: mlb pull skipped"
          python -m mlb_value_bot.griffbet pull            || echo "rsi: griff pull skipped"
          python -m mlb_value_bot.football pull            || echo "rsi: football pull skipped"
          python -m mlb_value_bot.rsi review --sport all --no-email
          python -m mlb_value_bot.rsi email                || echo "rsi email: skipped"
